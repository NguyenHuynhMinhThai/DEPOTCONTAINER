# =====================================================================
# HỆ THỐNG QUẢN LÝ DEPOT - Docker Compose
# =====================================================================
# Chạy: docker compose up -d
# Xem logs: docker compose logs -f
# Dừng:    docker compose down
# Xóa data: docker compose down -v
# =====================================================================

services:
  # ============== MySQL Database ==============
  mysql:
    image: mysql:8.0
    container_name: depot-mysql
    restart: unless-stopped
    environment:
      # Mật khẩu root MySQL (đã đồng bộ với appsettings.json)
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: depotdb
      # Tự động tạo user app với quyền từ xa (cho app .NET kết nối)
      MYSQL_USER: depot_user
      MYSQL_PASSWORD: depot123
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      # Host port 3307 -> container port 3306 (tránh đụng MySQL local)
      - "3307:3306"
    volumes:
      # Lưu data MySQL ra ngoài container (persistent)
      - mysql_data:/var/lib/mysql
      # Script khởi tạo (chạy 1 lần khi volume trống)
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Kiểm tra MySQL sẵn sàng trước khi app khởi động
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - depot-network

  # ============== .NET 10 Web App ==============
  app:
    # Image .NET 10 SDK chính thức - chạy thẳng source code
    # (không cần Dockerfile riêng, dev mode)
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: depot-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Connection string - trỏ vào MySQL container qua network nội bộ
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      ConnectionStrings__DefaultConnection: "server=mysql;port=3306;database=depotdb;user=root;password=root123;TreatTinyAsBoolean=false;"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      # Host port 8080 -> container port 8080
      - "8080:8080"
    volumes:
      # Mount source code để dev có thể sửa và reload ngay
      - .:/app
      - /app/bin
      - /app/obj
    working_dir: /app
    command:
      - sh
      - -c
      - |
        echo "[Startup] Đang restore NuGet packages..."
        dotnet restore && \
        echo "[Startup] Đang khởi động .NET app..." && \
        dotnet run --urls "http://+:8080"
    networks:
      - depot-network

# ============== Networks ==============
networks:
  depot-network:
    driver: bridge
    name: depot-network

# ============== Volumes ==============
volumes:
  mysql_data:
    name: depot-mysql-data
    driver: local